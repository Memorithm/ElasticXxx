[package]
name = "elastic-cli"
version = "0.1.0"
license-file.workspace = true
edition = "2021"
rust-version = "1.89"

[dependencies]
elastic = { package = "memorithm-elastic", path = "../elastic" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
elastic-language-syntax.workspace = true
syn = { version = "2", features = ["full", "visit"] }
prettyplease = "0.2"
proc-macro2 = "1"

[[bin]]
name = "cargo-elastic"
path = "src/bin/cargo-elastic.rs"
