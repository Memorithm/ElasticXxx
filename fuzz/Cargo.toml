[package]
name = "elastic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = "1"

[dependencies.elastic-core]
package = "memorithm-elastic-core"
path = "../crates/elastic-core"

[dependencies.elastic-kv]
package = "memorithm-elastic-kv"
path = "../crates/elastic-kv"

[dependencies.elastic-runtime]
package = "memorithm-elastic-runtime"
path = "../crates/elastic-runtime"

[dependencies.elastic-kernel]
package = "elastic-kernel"
path = "../crates/elastic-kernel"

[dependencies.elastic-language-syntax]
package = "memorithm-elastic-language-syntax"
path = "../crates/elastic-language-syntax"

[[bin]]
name = "transition_pipeline"
path = "fuzz_targets/transition_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifier_validation"
path = "fuzz_targets/identifier_validation.rs"
test = false
doc = false
