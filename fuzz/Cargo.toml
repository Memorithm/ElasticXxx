[package]
name = "elastic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.elastic-core]
package = "memorithm-elastic-core"
path = "../crates/elastic-core"

[dependencies.elastic-kv]
package = "memorithm-elastic-kv"
path = "../crates/elastic-kv"

[dependencies.elastic-runtime]
package = "memorithm-elastic-runtime"
path = "../crates/elastic-runtime"

[[bin]]
name = "transition_pipeline"
path = "fuzz_targets/transition_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifier_validation"
path = "fuzz_targets/identifier_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decision_trace_decode"
path = "fuzz_targets/decision_trace_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "operator_config_decode"
path = "fuzz_targets/operator_config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evidence_decode"
path = "fuzz_targets/evidence_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_config_decode"
path = "fuzz_targets/guard_config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_execution_contracts_decode"
path = "fuzz_targets/model_execution_contracts_decode.rs"
test = false
doc = false
bench = false
