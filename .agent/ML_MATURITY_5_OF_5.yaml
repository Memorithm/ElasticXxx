schema_version: 1
kind: memorithm_ml_maturity_program
status: active
last_updated: "2026-09-05"
repository: Memorithm/ElasticXxx
objective: >-
  Make ElasticXxx the evidence-backed 5/5 adaptive ML resource runtime: it must
  actuate real representation, memory, concurrency, batching, placement and
  kernel choices through explicit contracts while preserving caller invariants
  and rolling back failed adaptations.
score_policy:
  five_of_five_requires:
    - observe_forecast_plan_validate_act_verify_commit_or_rollback_is_executable_end_to_end
    - at_least_one_real_ML_workload_and_one_real_specialized_backend_are_controlled
    - every_adaptive_dimension_has_versioned_capability_state_transition_and_evidence_contracts
    - policy_quality_is_measured_against_a_static_baseline
    - exact_head_required_CI_green
  forbidden:
    - embedding_SciRust_tensor_semantics_or_SLHA_codec_semantics_into_generic_core
    - adapting_from_unverified_proxy_metrics
    - committing_a_transition_before_post_actuation_verification
