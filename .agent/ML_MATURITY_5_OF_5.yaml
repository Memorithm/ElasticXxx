completion_definition: >-
  ElasticXxx is 5/5 only when real ML workloads can be observed and safely
  adapted across multiple resource dimensions, every actuation is verified and
  rollback-capable, and reproducible evidence shows when adaptation beats or
  loses to static baselines under declared objectives.
