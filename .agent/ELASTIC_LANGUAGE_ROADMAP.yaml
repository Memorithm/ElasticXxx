schema_version: 1
kind: elasticxxx_embedded_language_agent_roadmap
status: active
last_updated: "2026-09-20"
repository: Memorithm/ElasticXxx
visibility_note: >-
  Agent roadmap retained off default branch. Do not merge this file to main
  unless the user explicitly requests it.

mission:
  primary: >-
    Evolve ElasticXxx from a qualified adaptive-resource runtime into a coherent
    resource-control language embedded in Rust, while keeping one typed semantic
    implementation from syntax through EIR, trusted validation, physical
    actuation, verification and rollback.
  language_pipeline: >-
    ELASTIC_SYNTAX -> PUBLIC_ELASTIC_API -> RESOURCE_MODEL -> EIR -> OBSERVE ->
    FORECAST -> POLICY -> PLAN -> VALIDATE -> ACT -> VERIFY -> COMMIT_OR_ROLLBACK
  publication_policy: suspended_by_user_until_product_is_materially_more_complete
  retained_release_state: >-
    The qualified 0.1.0 checkpoint is an internal reproducible baseline only.
    Registry publication and registry mutation remain unauthorized and must not
    block language/runtime development.

hard_invariants:
  - one_semantic_core_only_no_macro_specific_runtime_semantics
  - DSL_builder_and_derive_equivalence_is_tested
  - correctness_and_declared_invariants_dominate_optimization
  - missing_or_stale_evidence_never_becomes_positive_authority
  - trusted_validation_immediately_before_physical_actuation_remains_authoritative
  - every_mutating_path_requires_verify_then_commit_or_rollback_fail_closed
  - specialized_domain_semantics_remain_in_their_owning_repositories
  - no_performance_or_scientific_novelty_claim_without_direct_reproducible_evidence
  - public_convenience_surfaces_must_work_through_the_elastic_facade
  - retained_internal_baseline_must_remain_verifiable_while_main_advances

