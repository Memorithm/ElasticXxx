      - packageability_gate
      - migration_notes
    final_exit_criteria:
      - Boolean_guarding_is_a_supported_public_ElasticXxx_capability
      - production_domains_have_measured_behavior_and_no_semantic_regression
      - symbolic_backends_are_optional_bounded_and_fail_closed
      - cross_repo_reuse_is_versioned_not_copied_ad_hoc

required_test_strategy:
  exhaustive_small_domains:
    - all_TruthValue_pairs_for_each_operator
    - all_fact_assignments_for_small_expressions
    - generic_vs_compiled_equivalence
  property_families:
    - normalization_idempotence
    - canonicalization_determinism
    - compiled_guard_never_turns_False_or_Unknown_into_True_incorrectly
    - pruning_subset_property
    - serialization_roundtrip_when_wire_format_lands
  hardening:
    - fuzz_expression_parser_or_wire_decoder_when_added
    - fuzz_normalizer
    - fuzz_compiler
    - bounded_depth_and_node_count
    - no_panics_on_untrusted_wire_inputs

merge_protocol:
  - implement_one_reviewable_slice_per_PR
  - run_repository_required_CI_on_exact_head
  - fix_all_red_checks_and_conflicts
  - merge_only_green_exact_head
  - update_this_roadmap_status_after_each_merged_slice
  - immediately_select_next_unblocked_phase

current_execution:
  active_branch: feat/boolean-decision-core
  active_phase: BE1
  implemented_so_far:
    - TruthValue_strong_Kleene_semantics
    - PredicateId
    - FactMask
    - FactSet
    - bounded_BoolExpr
    - CompiledGuard_u64_fast_path
    - simple_contradiction_detection
    - facade_export_work_in_progress
