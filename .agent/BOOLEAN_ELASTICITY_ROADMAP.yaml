recurring_execution:
  requested_on: "2026-09-14"
  scheduler: Memorithm Research Autopilot
  cadence: hourly
  end_date: null
  mode: bounded_checkpointed_iterations
  scheduling_status: existing_hourly_task_confirmed_enabled
  scope: additive_to_all_existing_Memorithm_programmes
  mandate: >-
    Continue implementing the entire BE0-BE15 programme on every applicable
    scheduled pass, rather than producing only a plan or status. Each pass is
    finite and resumes from current GitHub evidence; no process is claimed to
    run continuously between scheduled passes. Preserve the consolidated task
    and all other projects; do not create a duplicate ElasticXxx task.
  iteration:
    - reread_AGENTS_this_roadmap_and_applicable_ecosystem_or_ML_overlays
    - inspect_current_main_open_PRs_reviews_and_exact_head_CI
    - resume_existing_work_before_creating_duplicate_branches
    - fix_demonstrated_correctness_failures_before_unrelated_optimization
    - code_and_test_the_earliest_unblocked_reviewable_slice
    - merge_only_after_all_applicable_exact_head_checks_are_successful
    - reread_new_main_after_merge_and_continue_with_the_next_unblocked_slice
    - checkpoint_written_executed_tested_merged_and_blocked_states_separately
    - assess_real_cross_repo_consumers_before_promoting_versioned_contracts
  blocked_runner_policy: >-
    Never equate queued CI with success, weaken workflow gates, or reconfigure
    trusted runner restrictions merely to merge. Work on an independent allowed
    slice while required execution is unavailable and preserve the exact resume
    point. Do not create an unbounded polling loop or fabricate test evidence.
  completion_policy: >-
    Close a phase only after all of its exit criteria are met. After BE15,
    continue justified correctness, qualification and measured improvement work,
    not artificial changes intended only to keep a loop busy. User stop or
    redirection instructions remain authoritative.

