schema_version: 2
kind: elastic_boolean_decision_roadmap
status: active
last_updated: "2026-09-13"
canonical_owner: Memorithm/ElasticXxx
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests
intended_consumers:
  - autonomous_coding_agents
  - ElasticXxx_maintainers
  - Memorithm/BooleanLab
  - Memorithm/TDI

mission: >-
  Add deterministic fail-closed Boolean and pseudo-Boolean decision machinery
  to ElasticXxx so impossible or unjustified resource actions can be rejected
  before expensive numeric ranking or actuation, while preserving numerical
  observation, forecasting, objectives, trusted validation, verification, and
  transactional rollback as authoritative runtime layers.

hard_invariants:
  - Unknown_is_not_False
  - missing_evidence_must_fail_closed_at_actuation_boundaries
  - Boolean_guards_may_reject_or_prune_but_never_make_an_illegal_transition_legal
  - numeric_objectives_remain_numeric_unless_a_versioned_discretization_contract_exists
  - every_public_convenience_surface_lowers_to_the_same_typed_core
  - every_cross_repository_contract_is_versioned_and_tested_before_reuse
  - compile_time_or_static_analysis_never_replaces_runtime_revalidation
  - required_CI_must_be_green_on_the_exact_PR_head_before_merge
  - no_performance_or_scientific_novelty_claim_without_direct_evidence
  - production_crates_remain_forbid_unsafe_code

non_goals:
  - replacing_continuous_resource_measurements_with_booleans
  - bypassing_EIR_validation_or_transactional_actuation
  - making_SAT_BDD_or_pseudo_boolean_solvers_actuation_authorities
  - importing_BooleanLab_experimental_assumptions_as_production_semantics
  - weakening_TDI_preregistration_or_confirmation_boundaries

ownership:
  ElasticXxx:
    owns:
      - production_truth_predicate_expression_and_guard_contracts
      - EIR_guard_representation_and_transition_eligibility
      - runtime_fact_derivation_and_candidate_pruning
      - decision_evidence_public_API_CLI_and_optional_symbolic_backends
  BooleanLab:
    owns:
      - experimental_boolean_function_search
      - exhaustive_small_domain_oracles
      - candidate_forms_complexity_and_representation_benchmarks
    integration_rule: promote_only_versioned_generic_results_after_validation
  TDI:
    owns:
      - TDI_9_3_boolean_policy_scientific_lineage
      - preregistration_holdout_and_confirmation_boundaries
    integration_rule: consume_Elastic_contracts_only_on_permitted_non_final_surfaces

architecture:
  pipeline:
    - numeric_observations_and_capabilities
    - typed_predicate_derivation
    - FactSnapshot_with_True_False_Unknown
    - canonical_BoolExpr_and_compiled_guards
    - EIR_guard_scope_resource_dimension_transition
    - Boolean_candidate_pruning
    - numeric_objective_ranking_of_survivors
    - VALIDATE
    - ACT
    - VERIFY
    - COMMIT_or_ROLLBACK
  portable_fast_path: u64_masks_then_multiword_masks
  truth_model: strong_Kleene_three_valued_logic
  symbolic_policy: optional_bounded_analysis_only

