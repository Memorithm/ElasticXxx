  correction_to_previous_roadmap: >-
    PR90 through PR93 are merged and their recorded final heads have successful
    ci and packageability runs. The old roadmap still described these slices as
    pending. BE6 and BE9 are therefore closed. BE7 core semantics are closed;
    live domain/controller qualification belongs to BE14. BE8 is closed through
    PR103 decoder fuzz/adversarial hardening. BE10 is closed through PR108 after
    exact-head CLI process, fail-closed input, and public-facade equivalence
    qualification. BE11a is now closed through PR110 strong-Kleene qualification;
    BE11 is closed through PR113 for the dependency-free exact analysis path and CLI. The optional concrete SAT/BDD backend remains deliberately deferred because the reviewed RustSAT/Minisat candidate did not satisfy the declared hard-memory-limit contract. BE12 is closed through PR120 after durable constraint reasons and pure replay identity checks qualified on the exact final head. BE13a multiword fact storage is closed through PR121, BE13b compiled multiword guards through PR122, and BE13c stable-order batch screening through PR123. PR124 qualifies the portable benchmark harness. PR125 retains the original DVFS-confounded negative evidence. PR129 qualifies the controlled portable measurement protocol. PR130 closes the BE13e acceleration gate conservatively: runtime feature diagnostics exist, but native codegen did not dominate the target fast paths, so no SVE/SVE2/native/SIMD production dispatch or speedup claim was authorized. PR131 hardens source reachability and codegen attestation and retains replacement controlled evidence without changing that negative decision. PR133 further hardens retained-evidence provenance by fail-closing inherited Cargo profile overrides, explicit encoded-rustflags presence, compiler/wrapper/linker overrides, and permanent source identity on exact-head green CI; it does not change the conservative no-dispatch decision. BE13 remains closed and qualified through this additional hardening. BE14a RAM capacity is qualified through PR126 plus PR127 with a guarded transactional cycle, an explicit CurrentStateForecaster boundary, DecisionTrace evidence, and a frozen strict V1 wire plus explicit V2 forecast metadata. BE14b concurrency is qualified through PR132: live active-permits evidence drives a stable fail-closed Boolean predicate, True only preserves a declared concurrency candidate, and the existing transactional adapter remains authoritative for validation, mutation, verification, commit and rollback. False and Unknown stop before mutation, and no performance claim is made. BE14c model-execution profiles is qualified through PR135: the Boolean resource-envelope guard preserves provider validity through evaluation, False/Unknown stop before numeric planning or mutation, and True delegates to the existing trusted model-execution transaction with verification/rollback. No performance or model-quality claim is made. BE14d KV cache is qualified through PR142 plus the real SLHAv2 PR113 consumer without performance claims. BE14e representation/precision is completed through PR146. BE14f kernel realization is qualified through PR149 for fail-closed planning, durable trace binding, trusted transaction/rollback and guarded-vs-unguarded semantic differential coverage; the portable benchmark is the earliest incomplete slice.

hard_invariants:
  - Unknown_is_not_False
  - missing_evidence_fails_closed
  - Boolean_guards_only_shrink_admissible_choices
  - no_guard_makes_an_undeclared_transition_legal
  - numerical_measurements_and_objectives_remain_numerical
  - trusted_validation_immediately_before_actuation_remains_authoritative
  - verification_and_rollback_are_not_bypassed
  - every_public_convenience_surface_lowers_to_the_same_typed_core
  - external_or_cached_evidence_requires_versioned_identity_and_revalidation
  - symbolic_solver_failure_timeout_or_unknown_never_authorizes_a_transition
  - pseudo_boolean_units_scaling_and_overflow_rules_are_explicit
  - required_CI_is_green_on_the_exact_candidate_head_before_merge
  - queued_missing_skipped_or_stale_checks_are_not_success
  - production_crates_remain_forbid_unsafe_code
  - no_performance_or_novelty_claim_without_direct_reproducible_evidence

