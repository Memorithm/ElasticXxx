schema_version: 1
kind: elastic_boolean_decision_roadmap
status: active
last_updated: "2026-09-13"
canonical_owner: Memorithm/ElasticXxx
intended_consumers:
  - autonomous_coding_agents
  - ElasticXxx_maintainers
  - Memorithm/BooleanLab
  - Memorithm/TDI
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission: >-
  Incorporate Boolean and pseudo-Boolean decision machinery broadly into
  ElasticXxx without replacing numerical observation, forecasting, objective
  ranking, or trusted actuation. Compile admissibility, invariant, capability,
  evidence, and policy conditions into deterministic fail-closed guards that
  can prune impossible work early, remain explainable, and preserve the single
  typed Elastic semantic core.

non_goals:
  - replacing_continuous_resource_measurements_with_booleans
  - claiming_speedups_without_benchmarks
  - moving_BooleanLab_experimental_semantics_into_ElasticXxx
  - moving_TDI_scientific_protocol_ownership_into_ElasticXxx
  - letting_SAT_BDD_or_optimization_backends_authorize_actuation
  - bypassing_existing_EIR_validation_invariants_or_transactional_actuation
  - introducing_unsafe_code_into_production_crates

hard_invariants:
  - Unknown_is_not_False
  - missing_evidence_must_fail_closed_at_actuation_boundaries
  - Boolean_guards_may_reject_or_prune_but_never_make_an_illegal_transition_legal
  - numeric_objectives_remain_numeric_unless_a_versioned_discretization_contract_exists
  - every_public_convenience_surface_lowers_to_the_same_typed_core
  - every_cross_repository_contract_is_versioned_and_tested_before_reuse
  - compile_time_or_static_analysis_never_replaces_runtime_revalidation
  - required_CI_must_be_green_on_the_exact_PR_head_before_merge
  - no_performance_or_scientific_novelty_claim_without_direct_evidence

ownership:
  ElasticXxx:
    owns:
      - production_TruthValue_and_predicate_identity_contracts
      - generic_BoolExpr_and_compiled_guard_semantics
      - EIR_representation_of_runtime_eligibility_guards
      - runtime_fact_extraction_from_explicit_observations_and_capabilities
      - transition_guard_evaluation_and_candidate_pruning
      - decision_trace_and_evidence_contracts
      - public_Rust_API_macros_CLI_and_diagnostics
      - optional_backend_traits_for_symbolic_analysis
    does_not_own:
      - BooleanLab_search_hypotheses_or_experimental_series
      - TDI_preregistration_holdout_or_scientific_claims
  BooleanLab:
    owns:
      - experimental_boolean_function_search
      - calibration_and_exhaustive_small_domain_oracles
      - candidate_boolean_forms_and_complexity_measurements
    integration_rule: >-
      Promote only generic validated primitives or versioned candidate artifacts;
      do not copy experimental assumptions into ElasticXxx production semantics.
  TDI:
    owns:
      - TDI_9_3_boolean_policy_research_and_scientific_lineage
      - leak_safe_policy_synthesis_experiments
      - confirmatory_boundaries_and_preregistration
    integration_rule: >-
      TDI may consume or compare ElasticXxx Boolean representations on permitted
      non-final surfaces, but ElasticXxx must not read forbidden holdouts or
      infer scientific claims from production integration.

architecture:
  pipeline:
    - numeric_observations_and_capabilities
    - typed_predicate_derivation
    - FactSet_with_True_False_Unknown
    - BoolExpr_or_compiled_guard
    - static_admissibility_and_candidate_pruning
    - numeric_objective_ranking_of_survivors
    - existing_VALIDATE_ACT_VERIFY_COMMIT_OR_ROLLBACK
  fast_path:
    representation: u64_masks_initially
    semantics: conjunction_of_positive_and_negative_atoms
    rule: optimization_must_be_observationally_equivalent_to_generic_evaluator
  generic_path:
    operators:
      - Const
      - Atom
      - Not
      - All
      - Any
      - Xor
      - Implies
    truth_model: strong_Kleene_three_valued_logic
  future_symbolic_path:
    optional:
      - canonical_normal_forms
      - BDD_backend
      - SAT_backend
      - pseudo_Boolean_backend
    rule: analysis_only_until_versioned_runtime_contract_and_evidence_exist

execution_order:
  - BE0
  - BE1
  - BE2
  - BE3
  - BE4
  - BE5
  - BE6
  - BE7
  - BE8
  - BE9
  - BE10
  - BE11
  - BE12
  - BE13
  - BE14
  - BE15

phases:
  - id: BE0
    name: bootstrap_and_contract_freeze
    status: active
    deliverables:
      - canonical_roadmap_on_agent_branch
      - ElasticXxx_AGENTS_mandatory_pointer
      - BooleanLab_bootstrap_overlay
      - TDI_bootstrap_overlay_for_TDI_9_3_reuse
      - explicit_ownership_and_non_goals
    exit_criteria:
      - every_relevant_agent_bootstrap_points_to_this_program_or_local_overlay
      - no_cross_repo_ownership_ambiguity_remains

  - id: BE1
    name: dependency_free_boolean_core
    status: active
    target_crate: elastic-core
    deliverables:
      - TruthValue_True_False_Unknown
      - PredicateId
      - FactMask
      - FactSet
      - bounded_BoolExpr
      - LogicError
      - CompiledGuard_u64_fast_path
      - contradiction_detection_for_simple_conjunctions
      - public_facade_reexports
      - elastic_downstream_single_dependency_guard
    validation:
      - truth_table_unit_tests
      - false_vs_unknown_regression_tests
      - generic_vs_fast_path_equivalence_tests
      - out_of_range_and_depth_limit_tests
      - workspace_fmt_clippy_test
    exit_criteria:
      - exact_PR_head_green
      - no_new_dependency_in_elastic-core
      - downstream_can_use_API_through_elastic_only

  - id: BE2
    name: canonicalization_and_stable_identity
    status: planned
    target_crates:
      - elastic-core
      - elastic-eir
    deliverables:
      - deterministic_predicate_registry
      - stable_predicate_namespaces
      - canonical_BoolExpr_ordering_for_commutative_nodes
      - duplicate_atom_elimination
      - constant_folding
      - double_negation_elimination
      - bounded_normalization_limits
      - stable_expression_fingerprint
      - schema_version_for_boolean_IR
    validation:
      - permutation_invariance_tests
      - fingerprint_stability_tests
      - normalization_idempotence_tests
      - adversarial_size_depth_tests
    exit_criteria:
      - equal_semantics_under_supported_canonical_rules_produce_same_canonical_form
      - malformed_or_oversized_inputs_fail_closed

  - id: BE3
    name: EIR_guard_contract
    status: planned
    target_crate: elastic-eir
    deliverables:
      - EirPredicate
      - EirGuard
      - guard_scope_resource_dimension_transition
      - lowering_from_typed_core
      - versioned_serializable_wire_ready_shape_without_committing_wire_format_prematurely
      - guard_fingerprint_in_resource_identity
      - validation_of_all_predicate_references
    validation:
      - deterministic_lowering_tests
      - unknown_predicate_rejection
      - invalid_scope_rejection
      - round_trip_internal_representation_tests
    exit_criteria:
      - every_guard_in_EIR_is_validated_deterministic_and_fingerprint_bound

  - id: BE4
    name: transition_guard_semantics
    status: planned
    target_crates:
      - elastic-core
      - elastic-eir
    deliverables:
      - TransitionGuard
      - requires_predicate
      - forbids_predicate
      - when_expression
      - guard_composition_rules
      - explicit_Unknown_outcome
      - guarded_transition_candidate_contract
    semantic_rule: >-
      True permits continued consideration, False rejects, Unknown maps to
      insufficient evidence unless a stricter caller policy explicitly rejects
      earlier; no Unknown path may authorize actuation.
    exit_criteria:
      - guard_cannot_fabricate_or_expand_admitted_transition_set

  - id: BE5
    name: runtime_fact_derivation
    status: planned
    target_crate: elastic-runtime
    deliverables:
      - PredicateEvaluator_trait
      - FactSnapshot_with_timestamp_and_source_identity
      - deterministic_derivation_from_PlanningContext
      - capability_predicates
      - evidence_presence_predicates
      - threshold_predicates
      - freshness_predicates
      - fact_snapshot_limits
      - source_and_generation_binding
    validation:
      - stale_fact_rejection
      - missing_observation_maps_to_Unknown
      - NaN_and_nonfinite_input_policy
      - deterministic_same_input_same_factset
    exit_criteria:
      - no_runtime_fact_can_claim_True_without_explicit_source_or_derivation

  - id: BE6
    name: planner_candidate_pruning
    status: planned
    target_crates:
      - elastic-eir
      - elastic-runtime
      - elastic-adapters
    deliverables:
      - eligible_transitions_API
      - rejected_transitions_with_reason
      - unknown_transitions_with_missing_facts
      - BooleanGuardPlanner_adapter_or_preplanner
      - integration_before_numeric_ranking
      - preservation_of_existing_FirstGrounded_Threshold_Headroom_semantics
    validation:
      - differential_tests_old_vs_guarded_when_guards_are_tautologies
      - pruning_never_adds_candidates
      - ordering_of_survivors_is_stable
    exit_criteria:
      - planner_work_can_be_reduced_without_semantic_drift

  - id: BE7
    name: invariant_booleanization
    status: planned
    target_crates:
      - elastic-core
      - elastic-runtime
    deliverables:
      - invariant_predicate_binding
      - distinction_between_static_guard_and_trusted_runtime_invariant_check
      - bulk_mask_precheck
      - retained_adapter_revalidation_immediately_before_actuation
      - post_actuation_verification_predicates_for_evidence_only
    rule: Boolean_precheck_never_replaces_trusted_adapter_validation
    exit_criteria:
      - existing_validate_with_checks_contract_remains_authoritative

  - id: BE8
    name: decision_trace_and_evidence
    status: planned
    target_crate: elastic-runtime
    deliverables:
      - DecisionTrace
      - predicate_value_trace
      - unknown_predicate_trace
      - short_circuit_reason
      - guard_fingerprint
      - fact_snapshot_fingerprint
      - selected_and_rejected_candidate_evidence
      - bounded_evidence_encoding
      - replay_compatibility_rules
    validation:
      - deterministic_trace_tests
      - evidence_size_limits
      - replay_identity_mismatch_rejection
    exit_criteria:
      - every_guarded_decision_can_be_explained_without_reexecuting_actuation

  - id: BE9
    name: Rust_programming_surface
    status: planned
    target_crates:
      - elastic
      - elastic-macros
      - elastic-downstream
    deliverables:
      - ElasticGuard_public_builder
      - typed_predicate_declaration_helpers
      - ergonomic_all_any_not_implies_builders
      - derive_attribute_extensions_only_if_they_lower_exactly_to_core
      - candidate_elastic_guard_macro_only_after_syntax_demand_is_demonstrated
      - compile_fail_tests_for_invalid_guard_attributes
      - facade_only_examples
    prohibited:
      - separate_macro_semantics
      - stringly_typed_runtime_evaluation
    exit_criteria:
      - ordinary_downstream_user_never_needs_internal_crates

  - id: BE10
    name: CLI_and_operator_configuration
    status: planned
    target_crates:
      - elastic-cli
      - elastic-runtime
    deliverables:
      - guard_check
      - guard_eval
      - guard_explain
      - guard_list_predicates
      - inspect_guard_fingerprints
      - operator_config_guard_schema
      - strict_unknown_field_rejection
      - dry_run_only_static_analysis_command
    exit_criteria:
      - CLI_has_no_hidden_semantics_not_available_in_library_API

  - id: BE11
    name: symbolic_static_analysis
    status: planned
    target_direction: optional_new_elastic_logic_crate_or_feature_gated_backend
    deliverables:
      - contradiction_detection_beyond_simple_conjunctions
      - tautology_detection
      - implication_queries
      - dead_rule_detection
      - redundant_predicate_detection
      - reachability_queries
      - mutually_exclusive_transition_detection
      - bounded_solver_resource_limits
    backend_policy:
      - start_with_internal_bounded_algorithms_for_small_forms
      - evaluate_BDD_and_SAT_libraries_before_dependency_adoption
      - keep_backend_optional
      - never_run_unbounded_solver_work_in_hot_path
    exit_criteria:
      - solver_failure_timeout_or_limit_is_explicit_and_never_authorizes_transition

  - id: BE12
    name: pseudo_boolean_resource_constraints
    status: planned
    deliverables:
      - weighted_boolean_term
      - <=_>=_=_constraints
      - cardinality_constraints
      - capacity_budget_encoding
      - coexistence_and_mutual_exclusion_constraints
      - bridge_to_numeric_resource_units_with_checked_integer_scaling
      - overflow_detection
      - deterministic_tie_breaking
    examples:
      - weighted_backend_selection_under_memory_budget
      - replica_count_under_capacity_budget
      - optional_feature_bundle_under_energy_budget
    exit_criteria:
      - integer_scaling_and_units_are_explicit_and_overflow_safe

  - id: BE13
    name: hardware_friendly_and_parallel_evaluation
    status: planned
    deliverables:
      - Vec_u64_multiword_factsets_beyond_64_predicates
      - word_parallel_bulk_candidate_screening
      - precomputed_guard_batches
      - cache_friendly_layout_benchmarks
      - optional_architecture_specific_acceleration_only_after_portable_baseline
      - no_std_feasibility_assessment_without_forcing_no_std_rewrite
    benchmark_matrix:
      - scalar_if_chain_baseline
      - generic_BoolExpr
      - u64_mask_guard
      - multiword_guard
      - batch_candidate_filter
    metrics:
      - ns_per_guard
      - candidates_per_second
      - allocations
      - bytes_per_guard
      - branch_misses_when_available
    exit_criteria:
      - performance_claims_are_published_only_with_reproducible_bench_evidence

  - id: BE14
    name: domain_integration
    status: planned
    target_domains:
      - RAM_capacity
      - concurrency
      - model_execution_profiles
      - KV_cache
      - representation_precision
      - kernel_realization
      - batching
      - device_placement
      - thermal_and_energy_constraints_when_observed
    per_domain_requirements:
      - define_predicate_registry
      - map_missing_data_to_Unknown
      - preserve_numeric_objective_stage
      - differential_test_against_pre_boolean_behavior
      - add_decision_trace
      - benchmark_before_claiming_gain
    exit_criteria:
      - at_least_RAM_concurrency_KV_and_model_execution_have_end_to_end_guarded_cycles

  - id: BE15
    name: cross_repository_research_promotion_and_productization
    status: planned
    integrations:
      BooleanLab:
        - differential_oracle_for_small_boolean_forms
        - candidate_simplification_and_complexity_studies
        - mask_fitting_experiments
        - promote_only_versioned_generic_results
      TDI:
        - compare_TDI_9_3_policy_representation_with_Elastic_BoolExpr_on_permitted_surfaces
        - keep_TDI_confirmatory_boundaries_untouched
        - test_policy_complexity_and_fail_closed_mutation_contracts
      SciRust:
        - promote_only_mathematically_general_reusable_primitives_after_evidence
        - do_not_move_Elastic_runtime_policy_into_SciRust
      Forge:
        - optional_search_over_guard_candidates_after_bounded_contract_exists
