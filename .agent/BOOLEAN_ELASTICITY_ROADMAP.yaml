  branch_rule: new_feature_branch_from_current_main_after_every_merge
  merge_rule: exact_head_required_checks_green_and_material_reviews_resolved
  roadmap_update_rule: update_this_file_after_every_phase_or_material_slice_change
  blocked_runner_rule: >-
    If required runners are unavailable, do not weaken gates or merge without
    evidence. Advance an independent allowed slice and preserve the exact resume
    point.
  no_fake_activity_rule: >-
    After BE15, continue only demonstrated correctness, qualification,
    integration, documentation or measured performance work.

