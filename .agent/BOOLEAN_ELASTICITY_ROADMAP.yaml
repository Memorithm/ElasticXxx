hard_invariants:
  - Unknown_is_not_False
  - missing_evidence_fails_closed
  - Boolean_guards_only_shrink_admissible_choices
  - no_guard_makes_an_undeclared_transition_legal
  - numerical_measurements_and_objectives_remain_numerical
  - trusted_validation_immediately_before_actuation_remains_authoritative
  - verification_and_rollback_are_not_bypassed
  - every_public_convenience_surface_lowers_to_the_same_typed_core
  - external_or_cached_evidence_requires_versioned_identity_and_revalidation
  - symbolic_solver_failure_timeout_or_unknown_never_authorizes_a_transition
  - pseudo_boolean_units_scaling_and_overflow_rules_are_explicit
  - required_CI_is_green_on_the_exact_candidate_head_before_merge
  - queued_missing_skipped_or_stale_checks_are_not_success
