    - verify_environment_or_problem_identity
    - independently_revalidate_hard_invariants
    - reject_missing_or_incompatible_evidence
  before_merge:
    - re_read_relevant_roadmaps
    - verify_exact_PR_head_SHA
    - require_all_required_CI_green_on_that_head
    - fail_closed_on_missing_required_evidence

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session_on_this_repository
    - before_selecting_the_next_major_runtime_or_Rust_ergonomics_phase
    - before_any_cross_repository_integration
    - after_any_user_change_to_resource_semantics_Rust_programming_goals_invariants_or_ecosystem_role
    - before_opening_or_merging_a_runtime_representation_kernel_CLI_macro_or_contract_PR
  must_update_this_file:
    - when_a_roadmap_phase_changes_status
    - when_a_cross_repository_contract_is_published_changed_or_rejected
    - when_a_runtime_failure_or_negative_result_changes_the_next_action
    - when_the_Rust_command_family_or_public_programming_model_changes
    - when_public_semver_MSRV_or_productization_policy_changes
  fail_closed: >-
    If this roadmap cannot be fetched or read, an autonomous agent must not make
    a major architecture, runtime-state-machine, Rust-programming-surface,
    representation-format, cross-repository integration, or merge decision.
    Read-only diagnosis is allowed.