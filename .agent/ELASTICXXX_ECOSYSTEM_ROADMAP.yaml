rust_programming_surface:
  principle: >-
    A Rust programmer should be able to declare what may adapt, what must remain
    invariant, what objective matters, inspect the resulting plan, execute it,
    understand a rejection, and reproduce a qualified decision without depending
    on ElasticXxx internal crates.
  existing_surfaces:
    - ResourceSpec_builder_and_typed_core_validation
    - derive_ElasticResource_reexported_through_the_elastic_facade
    - macro_and_manual_declaration_examples
    - public_runtime_builder_driver_and_operator_config_surfaces_reexported_through_elastic
    - CLI_commands_route_through_public_elastic_semantics_after_PR_51
    - SOUP_run_resource_plan_v1_reexported_through_elastic_after_PR_52
  required_library_direction:
    - public_runtime_builder_and_driver_through_the_elastic_facade
    - typed_observer_forecaster_planner_validator_actuator_and_verifier_extension_points
    - strongly_typed_plan_and_cycle_outcomes
    - dry_run_and_explanation_API
    - stable_error_taxonomy_suitable_for_human_and_machine_consumers
    - no_requirement_for_downstream_users_to_import_internal_implementation_crates
  required_command_family:
    status: implemented_primary_contract_after_PR_51
    commands:
      - name: elastic_inspect
        intent: inspect_declared_resources_capabilities_and_effective_configuration_without_actuation
      - name: elastic_plan
        intent: produce_and_validate_a_dry_run_plan_without_actuation
      - name: elastic_run
        intent: execute_one_or_more_full_control_cycles_with_explicit_outcomes
      - name: elastic_explain
        intent: explain_plan_selection_rejection_invariants_and_objective_ordering
      - name: elastic_doctor
        intent: diagnose_environment_capabilities_adapters_and_missing_prerequisites
      - name: elastic_replay
        intent: replay_a_qualified_versioned_plan_only_when_identity_and_capabilities_match
      - name: elastic_diff
        intent: compare_plans_observations_or_cycle_records_without_mutating_resources
    naming_rule: >-
      Final binary and subcommand spelling follows the actual elastic CLI layout;
      any future cargo-elastic wrapper must remain a thin frontend over the same
      public library semantics.
  cargo_integration:
    status: candidate_after_CLI_stabilization
    direction: >-
      Consider a cargo-elastic executable so users may invoke the same command
      family as `cargo elastic ...`; it must remain a thin frontend over the public
      ElasticXxx API and must not create separate semantics.
  macro_policy:
    - preserve_derive_ElasticResource_as_syntax_sugar_over_the_typed_builder
    - do_not_implement_a_function_like_elastic_macro_only_for_novelty
    - revisit_function_like_DSL_only_when_multi_resource_group_policy_or_planner_hint_semantics_create_real_ergonomic_need
    - require_equivalence_tests_between_macro_and_manual_forms

control_loop_contract:
  OBSERVE:
    produces:
      - immutable_or_versioned_observation_snapshot
      - capability_snapshot
      - environment_or_resource_fingerprint_when_relevant
  FORECAST:
    rule: forecasts_are_advisory_and_must_never_override_hard_invariants
  PLAN:
    rule: plans_must_be_explicit_versioned_and_replayable_when_possible
  VALIDATE:
    rule: reject_any_plan_that_cannot_prove_static_admissibility_before_actuation
  ACT:
    rule: apply_only_through_declared_actuation_boundaries
  VERIFY:
    rule: verify_post_actuation_semantics_and_objective_relevant_observations
  COMMIT_OR_ROLLBACK:
    rule: commit_only_after_verification_else_restore_or_fail_closed

