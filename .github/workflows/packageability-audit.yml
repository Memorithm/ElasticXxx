name: Release packageability audit

on:
  push:
    branches:
      - "feat/release-packageability-gate"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Simulate first-publish dependency availability
        shell: bash
        run: |
          cat >> Cargo.toml <<'EOF'

          [patch.crates-io]
          elastic-core = { path = "crates/elastic-core" }
          elastic-eir = { path = "crates/elastic-eir" }
          elastic-adapters = { path = "crates/elastic-adapters" }
          elastic-macros = { path = "crates/elastic-macros" }
          elastic-runtime = { path = "crates/elastic-runtime" }
          EOF
      - name: Package ordered public dependency chain
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            elastic-core \
            elastic-macros \
            elastic-eir \
            elastic-adapters \
            elastic-runtime \
            elastic
          do
            cargo package -p "$crate" --allow-dirty --no-verify
          done
