name: rustfmt-patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Require pinned Rust
        run: rustup toolchain list | grep -F '1.89.0' >/dev/null

      - name: Format working tree
        run: cargo +1.89.0 fmt --all

      - name: Capture patch
        run: git diff --binary > rustfmt.patch

      - name: Upload rustfmt patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
