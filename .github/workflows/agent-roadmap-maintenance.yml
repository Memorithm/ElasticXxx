name: Agent roadmap maintenance

on:
  push:
    branches:
      - agent/ecosystem-roadmap

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ecosystem-roadmap
      - name: Update roadmap evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('.agent/ELASTICXXX_ECOSYSTEM_ROADMAP.yaml')
          text = roadmap.read_text()
          text = text.replace('last_updated: "2026-09-05"', 'last_updated: "2026-09-06"', 1)
          text = text.replace(
              'wire_media_type: application/vnd.elastic.soup_run_resource_plan_v1+json',
              'wire_media_type: application/vnd.elastic.soup.run-resource-plan.v1+json',
          )
          fact_needle = '  - timestamped_model_resource_telemetry_preserves_provider_measurement_time_and_expired_samples_fail_closed_through_PR_67_merge_9d5664d1208532301637222f1ba430eda0f9a6b2\n\ninvariants:'
          fact_replacement = '''  - timestamped_model_resource_telemetry_preserves_provider_measurement_time_and_expired_samples_fail_closed_through_PR_67_merge_9d5664d1208532301637222f1ba430eda0f9a6b2
  - first_publish_packageability_gate_exists_through_PR_76_merge_1d0fe19e4a10069600b2d75beca7249a69a01835_without_authorizing_publication
  - ElasticBitAllocation_Stage_A_fixed_baseline_output_is_frozen_and_regression_tested_through_PR_77_merge_0b4514c1dc03e5efbbbdcfce2c736c0e102a435a
  - SciRust_physical_segment_accounting_prerequisite_for_ElasticBitAllocation_completed_through_scirust_PR_1355_and_PR_1356

invariants:'''
          if fact_needle not in text:
              raise SystemExit('verified facts insertion point not found')
          text = text.replace(fact_needle, fact_replacement, 1)
          ex9_needle = '''  - id: EX9
    name: Stable Rust productization
    status: long_term
    goals:'''
          ex9_replacement = '''  - id: EX9
    name: Stable Rust productization
    status: active_pre_release
    completed_slices:
      - id: EX9a
        name: First-publish packageability gate
        status: complete_pre_release_boundary
        completion_evidence:
          - PR_76_exact_head_6ca5b3336dbd2e5a64a16220f4291f117a7fac9b
          - PR_76_CI_303_and_packageability_1_completed_success_on_exact_head
          - PR_76_merged_to_main_as_1d0fe19e4a10069600b2d75beca7249a69a01835
          - internal_publish_path_dependencies_are_versioned_while_retaining_local_workspace_paths
          - full_facade_chain_package_file_sets_are_checked_and_leaf_archives_are_built_without_publishing
          - publication_remains_blocked_on_license_registry_name_ownership_public_private_topology_and_release_approval
    goals:'''
          if ex9_needle not in text:
              raise SystemExit('EX9 insertion point not found')
          text = text.replace(ex9_needle, ex9_replacement, 1)
          roadmap.write_text(text)

          ml = Path('.agent/ML_MATURITY_5_OF_5.yaml')
          text = ml.read_text()
          text = text.replace('last_updated: "2026-09-05"', 'last_updated: "2026-09-06"', 1)
          exml2_needle = '''  - id: EXML2
    name: Real representation actuation
    priority: P0
    goals:'''
          exml2_replacement = '''  - id: EXML2
    name: Real representation actuation
    priority: P0
    completed_slices:
      - id: EXML2a
        name: ElasticBitAllocation fixed Stage A evidence
        status: complete_synthetic_pre_allocator_gate
        completion_evidence:
          - PR_47_merged_to_main_as_a0307fd0b4b54523c96593400ed996fb070e668e
          - SciRust_PR_1355_design_merge_c4bbe93719d13536e8e81a67093642e7401f5051
          - SciRust_PR_1356_physical_segment_accounting_merge_acee535f3bb4dd20934652f6fec167aa0f6b2e0d
          - PR_77_exact_head_0f2fd4b8096b212657e6164686d3d0c761965bdb
          - PR_77_CI_305_packageability_3_and_continuous_hardening_8_completed_success_on_exact_head
          - PR_77_merged_to_main_as_0b4514c1dc03e5efbbbdcfce2c736c0e102a435a
          - nine_fixed_synthetic_candidates_have_frozen_exact_storage_and_reconstruction_records_with_byte_for_byte_regression_test
          - this_is_not_real_model_quality_latency_or_live_representation_actuation_evidence
          - allocator_search_and_acceptance_thresholds_remain_NO_GO_until_Stage_B_is_frozen_and_evidence_backed
    goals:'''
          if exml2_needle not in text:
              raise SystemExit('EXML2 insertion point not found')
          text = text.replace(exml2_needle, exml2_replacement, 1)
          ml.write_text(text)
          PY
      - name: Commit roadmap maintenance
        shell: bash
        run: |
          set -euo pipefail
          git add .agent/ELASTICXXX_ECOSYSTEM_ROADMAP.yaml .agent/ML_MATURITY_5_OF_5.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(agent): record packageability and Stage A evidence"
          git push origin HEAD:agent/ecosystem-roadmap
