name: Memorithm fleet main CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'research/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/memorithm-fleet-smoke.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memorithm-fleet-main-${{ github.repository }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-light, trusted-main]
    timeout-minutes: 15
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          python3 -m py_compile tools/validate_elastic_bit_stage_b.py
          python3 tools/validate_elastic_bit_stage_b.py research/elastic-bit-allocation-stage-b-smollm2-v1.json --self-test
      - run: python3 tools/verify_booleanlab_be15a_fixture.py --self-test
      - run: python3 tools/verify_tdi9_3_be15b_fixture.py --self-test

  rust:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-heavy, trusted-main]
    timeout-minutes: 30
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Format
        run: cargo +1.89.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.89.0 clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.89.0 test --workspace
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --workspace --no-deps
