name: ElasticBitAllocation Stage A freeze

on:
  push:
    branches:
      - "research/elastic-bit-allocation-stage-a-evidence"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/elastic-bit-allocation-stage-a-evidence
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Generate canonical Stage A baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/elastic-kv/tests/data
          cargo run -p elastic-kv --example elastic_bit_allocation_baseline \
            > crates/elastic-kv/tests/data/elastic-bit-allocation-baseline-v1.txt
      - name: Qualify elastic-kv
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p elastic-kv --all-targets -- -D warnings
          cargo test -p elastic-kv
      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git add crates/elastic-kv/tests/data/elastic-bit-allocation-baseline-v1.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research(kv): freeze Stage A baseline evidence"
          git push origin HEAD:research/elastic-bit-allocation-stage-a-evidence
