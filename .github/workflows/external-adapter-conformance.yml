name: External adapter v1 conformance

on:
  pull_request:
    paths:
      - 'crates/elastic/src/lib.rs'
      - 'crates/elastic-runtime/src/**'
      - 'fixtures/external-adapter-v1/**'
      - 'scripts/check-external-adapter-v1.py'
      - 'docs/adapters/external-adapter-conformance-v1.md'
      - '.github/workflows/external-adapter-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'crates/elastic/src/lib.rs'
      - 'crates/elastic-runtime/src/**'
      - 'fixtures/external-adapter-v1/**'
      - 'scripts/check-external-adapter-v1.py'
      - 'docs/adapters/external-adapter-conformance-v1.md'
      - '.github/workflows/external-adapter-conformance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  facade-only:
    name: standalone facade-only adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Verify facade-only source boundary
        shell: bash
        run: python3 scripts/check-external-adapter-v1.py

      - name: Format standalone fixture
        shell: bash
        run: cargo +1.89.0 fmt --manifest-path fixtures/external-adapter-v1/Cargo.toml -- --check

      - name: Test standalone fixture
        shell: bash
        run: cargo +1.89.0 test --manifest-path fixtures/external-adapter-v1/Cargo.toml

      - name: Clippy standalone fixture
        shell: bash
        run: cargo +1.89.0 clippy --manifest-path fixtures/external-adapter-v1/Cargo.toml --all-targets -- -D warnings

      - name: Rustdoc standalone fixture
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --manifest-path fixtures/external-adapter-v1/Cargo.toml --no-deps
