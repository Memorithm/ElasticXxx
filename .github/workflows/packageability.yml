name: packageability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Validate internal publish-path dependency metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          deps = root["workspace"]["dependencies"]
          expected = {
              "elastic-core": "crates/elastic-core",
              "elastic-eir": "crates/elastic-eir",
              "elastic-adapters": "crates/elastic-adapters",
              "elastic-macros": "crates/elastic-macros",
              "elastic-runtime": "crates/elastic-runtime",
          }
          for name, path in expected.items():
              spec = deps.get(name)
              assert isinstance(spec, dict), f"{name} must be a table dependency"
              assert spec.get("version") == "0.1.0", f"{name} must pin version 0.1.0"
              assert spec.get("path") == path, f"{name} must retain local path {path}"
          PY
      - name: Validate package file sets for full facade chain
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            elastic-core \
            elastic-macros \
            elastic-eir \
            elastic-adapters \
            elastic-runtime \
            elastic
          do
            cargo package -p "$crate" --allow-dirty --list >/dev/null
          done
      - name: Build first-publish leaf archives
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p elastic-core --allow-dirty --no-verify
          cargo package -p elastic-macros --allow-dirty --no-verify
