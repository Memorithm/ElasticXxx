name: ELANG7 CPU-only reference

on:
  pull_request:
    paths:
      - 'crates/elastic-core/**'
      - 'crates/elastic-adapters/**'
      - 'crates/elastic-runtime/**'
      - 'crates/elastic-kv/**'
      - 'crates/elastic/**'
      - 'crates/elastic-downstream/**'
      - 'scripts/qualify-elang7-cpu-only-reference.sh'
      - 'docs/language/EMBEDDED-CPU-ONLY-REFERENCE-0.1.md'
      - '.github/workflows/elang7-cpu-only-reference.yml'
  push:
    branches: [main]
    paths:
      - 'crates/elastic-core/**'
      - 'crates/elastic-adapters/**'
      - 'crates/elastic-runtime/**'
      - 'crates/elastic-kv/**'
      - 'crates/elastic/**'
      - 'crates/elastic-downstream/**'
      - 'scripts/qualify-elang7-cpu-only-reference.sh'
      - 'docs/language/EMBEDDED-CPU-ONLY-REFERENCE-0.1.md'
      - '.github/workflows/elang7-cpu-only-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: hosted x86_64 CPU-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0

      - name: Qualify ELANG7 on CPU-only hosted reference
        shell: bash
        run: bash scripts/qualify-elang7-cpu-only-reference.sh
