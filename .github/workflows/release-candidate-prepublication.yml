name: release-candidate-prepublication

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ''
      CARGO_REGISTRIES_CRATES_IO_TOKEN: ''
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted persistent runner and pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in
            tarek-scirust-arm64-01|tarek-scirust-arm64-02|tarek-scirust-arm64-03|tarek-scirust-arm64-04) ;;
            *)
              echo "::error::ElasticXxx release candidate gate requires tarek-scirust-arm64-01..04; refusing $RUNNER_NAME"
              exit 1
              ;;
          esac
          rustup toolchain list | grep -F '1.89.0' >/dev/null
          rustc +1.89.0 -Vv
      - name: Validate retained qualified baseline without registry mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_release_candidate.py \
            --require-clean \
            --write-receipt "$RUNNER_TEMP/release-candidate-receipt.json"
          cat "$RUNNER_TEMP/release-candidate-receipt.json"
          python3 - "$RUNNER_TEMP/release-candidate-receipt.json" "${{ github.event.pull_request.head.sha || github.sha }}" <<'PY'
          import json
          import sys

          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          current = sys.argv[2]
          assert receipt['baseline_source_commit'] == 'fc3c842205bb7ea46ef402826da865717a5a323e'
          assert receipt['baseline_source_tree'] == '23d7ff90986cfd53c29c7eea1b2059b1d29d8054'
          assert receipt['current_head'] == current, (receipt['current_head'], current)
          assert receipt['publication_suspended'] is True
          assert receipt['registry_publication_authorized'] is False
          assert receipt['registry_mutation_authorized'] is False
          assert receipt['network_registry_queries_performed'] is False
          PY
      - name: Record exact-head receipt summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### ElasticXxx retained internal baseline'
            echo
            echo '- qualified baseline head: `fc3c842205bb7ea46ef402826da865717a5a323e`'
            echo "- current development head: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo '- publication: **suspended / unauthorized**'
            echo '- registry mutation: **unauthorized**'
            echo '- registry network query in this gate: **none**'
          } >> "$GITHUB_STEP_SUMMARY"
