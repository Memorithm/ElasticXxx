name: continuous-hardening

on:
  pull_request:
    paths:
      - "crates/elastic-core/**"
      - "crates/elastic-kv/**"
      - "crates/elastic-runtime/**"
      - "fuzz/**"
      - ".github/workflows/continuous-hardening.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Compile fuzz targets
        run: cargo +nightly fuzz build

      - name: Fuzz identifier validation
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run identifier_validation -- -max_total_time=45

      - name: Fuzz transition pipeline
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run transition_pipeline -- -max_total_time=60

      - name: Fuzz decision trace decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run decision_trace_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz operator config decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run operator_config_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz runtime evidence decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run evidence_decode -- -max_total_time=60 -max_len=1048577

  miri:
    name: miri-core-kv-runtime
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri

      - name: Build Miri sysroot
        run: cargo +nightly miri setup

      - name: Interpret core and KV tests
        run: cargo +nightly miri test -p memorithm-elastic-core -p memorithm-elastic-kv

      - name: Interpret bounded persisted runtime decoders
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly miri test -p memorithm-elastic-runtime operator_config::tests::bounded_decoder
          cargo +nightly miri test -p memorithm-elastic-runtime evidence::tests::
