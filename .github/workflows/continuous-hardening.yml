name: continuous-hardening

on:
  pull_request:
    paths:
      - "crates/elastic-core/**"
      - "crates/elastic-kernel/**"
      - "crates/elastic-language-syntax/**"
      - "crates/elastic-kv/**"
      - "crates/elastic-runtime/**"
      - "fuzz/**"
      - ".github/workflows/continuous-hardening.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Compile fuzz targets
        run: cargo +nightly fuzz build

      - name: Fuzz identifier validation
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run identifier_validation -- -max_total_time=45

      - name: Fuzz transition pipeline
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run transition_pipeline -- -max_total_time=60

      - name: Fuzz decision trace decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run decision_trace_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz operator config decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run operator_config_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz runtime evidence decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run evidence_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz guard config decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run guard_config_decode -- -max_total_time=60 -max_len=262145

      - name: Fuzz model execution controller contracts
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run model_execution_contracts_decode -- -max_total_time=60 -max_len=262145

      - name: Fuzz Elastic language parser and expander
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run language_syntax_expand -- -max_total_time=60 -max_len=262145

      - name: Fuzz constrained decision trace decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run constrained_decision_trace_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz Boolean kernel trace decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run boolean_kernel_trace_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz Boolean batch/device trace decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run boolean_batch_device_trace_decode -- -max_total_time=60 -max_len=1048577

      - name: Fuzz Forge search candidate decoder
        if: github.event_name != 'pull_request'
        run: cargo +nightly fuzz run forge_search_candidate_decode -- -max_total_time=60 -max_len=393217


  elang9-exact-head:
    name: ELANG9 exact-head hardening
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri

      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Execute final ELANG9 fuzz surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fuzz run language_syntax_expand -- -max_total_time=15 -max_len=262145
          cargo +nightly fuzz run constrained_decision_trace_decode -- -max_total_time=15 -max_len=1048577
          cargo +nightly fuzz run boolean_kernel_trace_decode -- -max_total_time=15 -max_len=1048577
          cargo +nightly fuzz run boolean_batch_device_trace_decode -- -max_total_time=15 -max_len=1048577
          cargo +nightly fuzz run forge_search_candidate_decode -- -max_total_time=15 -max_len=393217

      - name: Interpret final ELANG9 parser and decoder tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly miri setup
          cargo +nightly miri test -p memorithm-elastic-language-syntax
          cargo +nightly miri test -p elastic-kernel boolean_admission::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime decision_trace::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime batch_device_boolean_admission::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime forge_search_bridge::tests::


  miri:
    name: miri-core-kv-runtime
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri

      - name: Build Miri sysroot
        run: cargo +nightly miri setup

      - name: Interpret core, KV, language and kernel tests
        run: |
          cargo +nightly miri test -p memorithm-elastic-core -p memorithm-elastic-kv
          cargo +nightly miri test -p memorithm-elastic-language-syntax
          cargo +nightly miri test -p elastic-kernel boolean_admission::tests::

      - name: Interpret bounded persisted runtime decoders
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly miri test -p memorithm-elastic-runtime operator_config::tests::bounded_decoder
          cargo +nightly miri test -p memorithm-elastic-runtime evidence::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime guard_config::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime model_execution_contracts::tests::bounded_decoder
          cargo +nightly miri test -p memorithm-elastic-runtime decision_trace::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime batch_device_boolean_admission::tests::
          cargo +nightly miri test -p memorithm-elastic-runtime forge_search_bridge::tests::
